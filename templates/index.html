<!DOCTYPE html>
<html lang="zh">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <title>文献 Agent</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", sans-serif;
            max-width: 820px;
            margin: 0 auto;
            padding: 20px;
            background: #f9f9f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 { font-size: 20px; margin: 0 0 12px; }
        .paper-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .paper-bar label { font-size: 14px; color: #666; }
        select {
            flex: 1;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }
        .msg {
            display: flex;
            margin-bottom: 16px;
        }
        .msg.user { justify-content: flex-end; }
        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 15px;
        }
        .user .bubble {
            background: #0070f3;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai .bubble {
            background: white;
            color: #222;
            border: 1px solid #e5e5e5;
            border-bottom-left-radius: 4px;
        }
        .system-tip {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin: 20px 0;
        }
        .input-bar {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid #e5e5e5;
        }
        textarea {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            resize: none;
            font-family: inherit;
        }
        button {
            padding: 0 24px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #0051cc; }
        button:disabled { background: #999; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>文献 Agent</h1>
    <div class="paper-bar">
        <label>论文：</label>
        <select id="paper" onchange="clearChat()">
            {% for p in papers %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
        </select>
    <input type="file" id="pdfFile" accept=".pdf" style="display:none" onchange="uploadPdf()">
    <button onclick="document.getElementById('pdfFile').click()" style="padding: 6px 12px; font-size: 13px; background: #666;">上传 PDF</button>
    </div>

    <div id="chat"></div>

    <div class="input-bar">
        <textarea id="question" rows="2" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="submit" onclick="ask()">发送</button>
    </div>

    <script>
        const threadId = "web-" + Math.random().toString(36).slice(2, 10);

        async function uploadPdf(){
            const fileInput = document.getElementById('pdfFile');
            const file = fileInput.files[0]
            if(!file) return;

            const chat = document.getElementById("chat");
            const tip = document.createElement('div')
            tip.className = 'system-tip'
            tip.textContent = "正在上传并建立索引，请稍候（可能需要几十秒）...";
            chat.appendChild(tip)
            chat.scrollTop = chat.scrollHeight;

            const formData = new FormData();
            formData.append('file',file);

            try{
                const resp = await fetch('/upload',{method:'POST',body:formData})
                const data = await resp.json()

                if(data.error){
                    tip.textContent = '上传失败:' + data.error;
                    return;
                }

                tip.textContent = data.message;

                const select = document.getElementById('paper');
                const option = document.createElement('option');
                option.value = data.paper;
                option.textContent = data.paper;
                select.appendChild(option);
                select.value = data.paper;

            }catch(e){
                tip.textContent = '上传失败' + e;
            }finally{
                fileInput.value = '';
            }
        }

        function addMsg(role, text) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "msg " + role;
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            // bubble.textContent = text;
            bubble.innerHTML = marked.parse(text);
            div.appendChild(bubble);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return bubble;
        }

        function clearChat() {
            const chat = document.getElementById("chat");
            chat.innerHTML = "";

            const paper = document.getElementById("paper").value;
            const tip = document.createElement("div");
            tip.className = "system-tip";
            tip.textContent = "—— 已切换到论文：" + paper + " ——";
            chat.appendChild(tip);
        }

        async function ask() {
            const paper = document.getElementById("paper").value;
            const input = document.getElementById("question");
            const question = input.value.trim();
            const btn = document.getElementById("submit");

            if (!question) return;

            addMsg("user", question);
            input.value = "";
            btn.disabled = true;

            const aiBubble = addMsg("ai", "思考中...");

            try {
                const resp = await fetch("/ask", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({paper, question, thread_id: threadId}),
                });
                const data = await resp.json();
                aiBubble.innerHTML = marked.parse(data.answer);
            } catch (e) {
                aiBubble.innerHTML = "请求失败：" + e;
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        document.getElementById("question").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                ask();
            }
        });
    </script>
</body>
</html>
