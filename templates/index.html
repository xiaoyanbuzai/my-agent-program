<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>文献 Agent</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        select, textarea, button { font-size: 16px; padding: 8px; margin: 8px 0; width: 100%; box-sizing: border-box; }
        #answer { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 8px; margin-top: 16px; min-height: 100px; }
        button { background: #0070f3; color: white; border: none; cursor: pointer; }
        button:hover { background: #0051cc; }
        button:disabled { background: #999; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>文献 Agent</h1>
    <label>选择论文：</label>
    <select id="paper">
        {% for p in papers %}
        <option value="{{ p }}">{{ p }}</option>
        {% endfor %}
    </select>

    <label>输入问题：</label>
    <textarea id="question" rows="3" placeholder="例如：这篇论文要解决的核心问题是什么？"></textarea>

    <button id="submit" onclick="ask()">提问</button>
    <div id="answer">等待提问...</div>

    <script>
        async function ask() {
            const paper = document.getElementById("paper").value;
            const question = document.getElementById("question").value;
            const answerDiv = document.getElementById("answer");
            const btn = document.getElementById("submit");

            if (!question.trim()) return;

            btn.disabled = true;
            answerDiv.textContent = "思考中...";

            try {
                const resp = await fetch("/ask", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({paper, question}),
                });
                const data = await resp.json();
                answerDiv.textContent = data.answer;
            } catch (e) {
                answerDiv.textContent = "请求失败：" + e;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
