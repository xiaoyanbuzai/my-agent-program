[project]
name = "my-agent-program"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pdfplumber>=0.11.10",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "tzdata>=2026.4",
]

[project.scripts]
my-agent-program = "my_agent_program:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
