[project]
name = "my-agent-program"
version = "0.2.0"
description = "多租户学术文献知识库 Agent：混合检索 + 多模态输入 + 可溯源引用"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.141.1",
    "huggingface-hub>=0.30.0",
    "jieba>=0.42.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "lxml>=6.1.3",
    "markdown>=3.11.1",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "requests>=2.32.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0.54",
    "tzdata>=2026.4",
    "uvicorn>=0.53.0",
    "zhipuai>=2.1.5.20250825",
]

[project.scripts]
my-agent-program = "my_agent_program:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".venv",
    "legacy",
    "data",
    # 早期“一篇论文一个 collection”的演示脚本，不参与运行时
    "langgraph_demo.py",
    "retriever.py",
    "tools.py",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
